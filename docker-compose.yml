name: zeroqwait

services:
  # PostgreSQL
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zeroqwait_dev
      POSTGRES_DB: zeroqwait
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build: ./backend
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./backend:/app
      - ./backend/static:/app/static
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - DB_HOST=db
      - OLLAMA_URL=${OLLAMA_URL:-http://${K8S_NODE_IP:-192.168.2.134}:30002}
      - MODEL_NAME=${MODEL_NAME:-qwen3:14b-q4_K_M}
      - TTS_SERVICE_URL=${TTS_SERVICE_URL:-http://${K8S_NODE_IP:-192.168.2.134}:30880}
      - TWENTY_GRAPHQL_URL=${TWENTY_GRAPHQL_URL:-http://twenty:3000/graphql}
      - TWENTY_API_KEY=${TWENTY_API_KEY:-}
      - ODOO_ENABLED=${ODOO_ENABLED:-true}
      - ODOO_URL=${ODOO_URL:-http://odoo:8069}
      - ODOO_DB=${ODOO_DB:-odoo}
      - ODOO_USER=${ODOO_USER:-admin}
      - ODOO_PASSWORD=${ODOO_PASSWORD:-admin}
      - UV_CACHE_DIR=/tmp/uv-cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Twenty CRM
  twenty:
    image: twentycrm/twenty:latest
    ports:
      - "${TWENTY_HOST_PORT:-3001}:3000"
    environment:
      - SERVER_URL=http://localhost:3001
      - FRONT_BASE_URL=http://localhost:3001
      - PG_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-zeroqwait_dev}@db:5432/twenty
      - STORAGE_TYPE=local
      - MESSAGE_QUEUE_TYPE=pg-boss
      - REDIS_URL=redis://redis:6379
      - APP_SECRET=${TWENTY_APP_SECRET:-change_me_twenty_secret}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Odoo 17 Community ERP
  odoo:
    image: odoo:17.0
    ports:
      - "${ODOO_HOST_PORT:-8069}:8069"
    environment:
      - HOST=db
      - PORT=5432
      - USER=odoo
      - PASSWORD=odoo_dev
    volumes:
      - odoo_data:/var/lib/odoo
      - odoo_addons:/mnt/extra-addons
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  odoo_data:
  odoo_addons:
