server {
    listen 80;
    server_name _;

    # Re-resolve service names so frontend survives backend container restarts.
    # K8s CoreDNS resolver (k3s default). Falls back gracefully if unavailable.
    resolver 10.43.0.10 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Handle React Router
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # SSE stream endpoint needs unbuffered proxying and dynamic backend DNS resolution.
    location = /api/agent/master/chat/stream {
        set $backend_upstream http://backend.zeroqwait.svc.cluster.local:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # Owner-facing agent SSE stream — same settings required (LLM calls can take 2+ minutes).
    location = /api/v2/agent/chat/stream {
        set $backend_upstream http://backend.zeroqwait.svc.cluster.local:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # WebSocket proxying (must come before generic /api block)
    location /api/ws/ {
        set $backend_upstream http://backend.zeroqwait.svc.cluster.local:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy API requests to backend
    location /api {
        set $backend_upstream http://backend.zeroqwait.svc.cluster.local:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /docs (and sub-paths) to backend Docsify documentation site
    # nginx handles the /docs -> /docs/ redirect itself to preserve host:port
    location = /docs {
        return 301 $scheme://$http_host/docs/;
    }
    location /docs/ {
        set $backend_upstream http://backend.zeroqwait.svc.cluster.local:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
