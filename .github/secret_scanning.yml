# Secret scanning configuration
# https://docs.github.com/en/code-security/secret-scanning/configuring-secret-scanning-for-your-repositories
#
# Push protection is enabled at the repository level via Settings → Code Security.
# This file configures which paths to EXCLUDE from scanning (e.g. test fixtures
# that intentionally contain fake credentials).
#
# Patterns we exclude because they contain synthetic/test-only data:
paths-ignore:
  - "backend/scripts/shop_login_info_test.txt"
  - "backend/shop_login_info_test.txt"
  - "backend/test_accounts.txt"
  - "backend/scripts/shop_login_info_prod.txt"
  - "backend/shop_login_info_prod.txt"
