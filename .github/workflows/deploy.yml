name: Deploy to Production Host

on:
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Deploy to Production Host
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PI_HOST }}
        username: ${{ secrets.PI_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          echo "🚀 Starting deployment..."
          
          # Navigate to project directory
          cd /home/pi/Documents/projects/apps/zeroqwait
          
          # Pull latest changes
          echo "📥 Pulling latest changes from GitHub..."
          git pull origin main
          
          # Stop containers and cleanup
          echo "🛑 Stopping containers and cleaning up volumes..."
          docker compose -f docker-compose.prod.yml down -v
          docker system prune -f
          
          # Build new images
          echo "🔨 Building Docker images..."
          docker compose -f docker-compose.prod.yml build --pull --no-cache
          
          # Start containers
          echo "🚀 Starting containers..."
          docker compose -f docker-compose.prod.yml up -d
          
          # Wait for containers to be healthy
          echo "⏳ Waiting for containers to start..."
          sleep 15
          
          # Check status
          echo "📊 Container status:"
          docker compose -f docker-compose.prod.yml ps
          
          # Clean up old images
          echo "🧹 Cleaning up old Docker images..."
          docker image prune -f
          
          echo "✅ Deployment complete!"
          
    - name: Verify deployment
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PI_HOST }}
        username: ${{ secrets.PI_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          echo "🔍 Verifying deployment..."
          
          # Test API
          if curl -f http://localhost:8000/ > /dev/null 2>&1; then
            echo "✅ Backend is responding"
          else
            echo "❌ Backend health check failed"
            exit 1
          fi
          
          # Test frontend
          if curl -f http://localhost:3000/ > /dev/null 2>&1; then
            echo "✅ Frontend is responding"
          else
            echo "❌ Frontend health check failed"
            exit 1
          fi
          
          echo "🎉 Deployment verified successfully!"
          
    - name: Notify on success
      if: success()
      run: |
        echo "✅ Deployment to production host successful!"
        echo "🌐 Site: https://zeroqwait.com"
        echo "🔌 API: https://zeroqwait.com/api"
        
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Deployment failed! Check the logs above."
        exit 1
