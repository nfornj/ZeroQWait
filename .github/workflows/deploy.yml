name: Deploy to Production Host

on:
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # ─── Step 1: Write backend/.env from GitHub Secrets onto the server ───────
    # All sensitive values live in GitHub Secrets — never committed to git.
    # This step is the authoritative source of truth for every credential.
    - name: Inject secrets into backend/.env on server
      uses: appleboy/ssh-action@v1.0.0
      env:
        # Populate env vars from GitHub Secrets so they are available in the
        # remote script.  New secrets can be added here + to the cat block below.
        SECRET_KEY:                ${{ secrets.SECRET_KEY }}
        DB_USER:                   ${{ secrets.DB_USER }}
        DB_PASSWORD:               ${{ secrets.DB_PASSWORD }}
        REDIS_PASSWORD:            ${{ secrets.REDIS_PASSWORD }}
        NVIDIA_API_KEY:            ${{ secrets.NVIDIA_API_KEY }}
        LLM_CONFIG_ENCRYPTION_KEY: ${{ secrets.LLM_CONFIG_ENCRYPTION_KEY }}
        TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CLOUDFLARE_API_TOKEN:      ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ZONE_ID:        ${{ secrets.CLOUDFLARE_ZONE_ID }}
      with:
        host:     ${{ secrets.PI_HOST }}
        username: ${{ secrets.PI_USER }}
        key:      ${{ secrets.SSH_PRIVATE_KEY }}
        port:     22
        # envs makes the env block above available inside the remote script
        envs: SECRET_KEY,DB_USER,DB_PASSWORD,REDIS_PASSWORD,NVIDIA_API_KEY,LLM_CONFIG_ENCRYPTION_KEY,TELEGRAM_BOT_TOKEN,CLOUDFLARE_API_TOKEN,CLOUDFLARE_ZONE_ID
        script: |
          set -euo pipefail
          PROJECT_DIR="/home/pi/Documents/projects/apps/zeroqwait"
          ENV_FILE="${PROJECT_DIR}/backend/.env"
          echo "📝 Writing backend/.env from GitHub Secrets..."
          mkdir -p "$(dirname "${ENV_FILE}")"
          # Write the .env file — values come from GitHub Secrets injected above
          cat > "${ENV_FILE}" << ENVEOF
          # Generated by GitHub Actions deploy workflow — do NOT edit manually.
          # To change any value, update the corresponding GitHub Secret and redeploy.
          DB_HOST=db
          DB_PORT=5432
          DB_NAME=zeroqwait
          DB_USER=${DB_USER:-postgres}
          DB_PASSWORD=${DB_PASSWORD}
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=${REDIS_PASSWORD:-}
          SECRET_KEY=${SECRET_KEY}
          LLM_PROVIDER=nvidia
          NVIDIA_MODEL=meta/llama-3.1-8b-instruct
          NVIDIA_API_KEY=${NVIDIA_API_KEY}
          LLM_CONFIG_ENCRYPTION_KEY=${LLM_CONFIG_ENCRYPTION_KEY:-${SECRET_KEY}}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
          CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
          CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID:-}
          FRONTEND_URL=https://zeroqwait.com
          ENVEOF
          # Trim leading whitespace introduced by heredoc indentation
          sed -i 's/^[[:space:]]*//' "${ENV_FILE}"
          # Protect the file — only owner can read it
          chmod 600 "${ENV_FILE}"
          echo "✅ backend/.env written ($(wc -l < "${ENV_FILE}") lines)"
          # Quick sanity check — confirm NVIDIA_API_KEY is non-empty in the file
          if grep -q "^NVIDIA_API_KEY=nvapi" "${ENV_FILE}"; then
            echo "✅ NVIDIA_API_KEY confirmed present"
          elif grep -q "^NVIDIA_API_KEY=.\{8\}" "${ENV_FILE}"; then
            echo "✅ NVIDIA_API_KEY present (non-standard prefix)"
          else
            echo "❌ NVIDIA_API_KEY is missing or empty — check GitHub Secret NVIDIA_API_KEY"
            exit 1
          fi

    # ─── Step 2: Pull code and restart containers ────────────────────────────
    - name: Deploy to Production Host
      uses: appleboy/ssh-action@v1.0.0
      with:
        host:     ${{ secrets.PI_HOST }}
        username: ${{ secrets.PI_USER }}
        key:      ${{ secrets.SSH_PRIVATE_KEY }}
        port:     22
        script: |
          set -euo pipefail
          echo "🚀 Starting deployment..."
          cd /home/pi/Documents/projects/apps/zeroqwait

          echo "📥 Pulling latest changes from GitHub..."
          git pull origin main

          echo "🛑 Stopping containers..."
          docker compose -f docker-compose.prod.yml down
          docker system prune -f

          echo "🔨 Building Docker images..."
          docker compose -f docker-compose.prod.yml build --pull --no-cache

          echo "🚀 Starting containers..."
          docker compose -f docker-compose.prod.yml up -d

          echo "⏳ Waiting for containers to start..."
          sleep 20

          echo "📊 Container status:"
          docker compose -f docker-compose.prod.yml ps

          docker image prune -f
          echo "✅ Deployment complete!"

    # ─── Step 3: Verify the backend starts correctly ─────────────────────────
    - name: Verify deployment
      uses: appleboy/ssh-action@v1.0.0
      with:
        host:     ${{ secrets.PI_HOST }}
        username: ${{ secrets.PI_USER }}
        key:      ${{ secrets.SSH_PRIVATE_KEY }}
        port:     22
        script: |
          set -euo pipefail
          echo "🔍 Verifying deployment..."

          if curl -sf http://localhost:8001/api/agent/health > /dev/null; then
            echo "✅ Backend is healthy"
          else
            echo "❌ Backend health check failed"
            docker compose -f /home/pi/Documents/projects/apps/zeroqwait/docker-compose.prod.yml logs --tail=40 backend
            exit 1
          fi

          if curl -sf http://localhost:3001/ > /dev/null; then
            echo "✅ Frontend is responding"
          else
            echo "❌ Frontend health check failed"
            exit 1
          fi

          # Verify NVIDIA_API_KEY loaded inside the running container
          LOADED_KEY=$(docker exec zeroqwait-backend \
            python3 -c "import os; k=os.getenv('NVIDIA_API_KEY',''); print('SET' if len(k)>8 else 'MISSING')" 2>/dev/null || echo "UNKNOWN")
          if [[ "${LOADED_KEY}" == "SET" ]]; then
            echo "✅ NVIDIA_API_KEY is loaded inside the backend container"
          else
            echo "❌ NVIDIA_API_KEY not loaded in container (got: ${LOADED_KEY})"
            exit 1
          fi

          echo "🎉 Deployment verified successfully!"

    - name: Notify on success
      if: success()
      run: |
        echo "✅ Deployment to production host successful!"
        echo "🌐 Site: https://zeroqwait.com"

    - name: Notify on failure
      if: failure()
      run: echo "❌ Deployment failed — check the logs above."
