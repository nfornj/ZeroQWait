name: Deploy on Self-Hosted Runner

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # ─── Inject secrets from GitHub Secrets into backend/.env ────────────────
    # The runner writes the file directly — no SSH required.
    # All credential values live exclusively in GitHub Secrets.
    - name: Write backend/.env from GitHub Secrets
      env:
        SECRET_KEY:                ${{ secrets.SECRET_KEY }}
        DB_USER:                   ${{ secrets.DB_USER }}
        DB_PASSWORD:               ${{ secrets.DB_PASSWORD }}
        REDIS_PASSWORD:            ${{ secrets.REDIS_PASSWORD }}
        NVIDIA_API_KEY:            ${{ secrets.NVIDIA_API_KEY }}
        LLM_CONFIG_ENCRYPTION_KEY: ${{ secrets.LLM_CONFIG_ENCRYPTION_KEY }}
        TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CLOUDFLARE_API_TOKEN:      ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ZONE_ID:        ${{ secrets.CLOUDFLARE_ZONE_ID }}
      run: |
        set -euo pipefail
        ENV_FILE="${GITHUB_WORKSPACE}/backend/.env"
        echo "📝 Writing backend/.env from GitHub Secrets..."
        cat > "${ENV_FILE}" << 'ENVEOF'
        # Generated by GitHub Actions — do NOT edit manually.
        ENVEOF
        # Re-write with actual values (single-quoted heredoc can't expand vars)
        cat > "${ENV_FILE}" << ENVEOF
        # Generated by GitHub Actions deploy workflow — do NOT edit manually.
        DB_HOST=db
        DB_PORT=5432
        DB_NAME=zeroqwait
        DB_USER=${DB_USER:-postgres}
        DB_PASSWORD=${DB_PASSWORD}
        REDIS_HOST=redis
        REDIS_PORT=6379
        REDIS_PASSWORD=${REDIS_PASSWORD:-}
        SECRET_KEY=${SECRET_KEY}
        LLM_PROVIDER=nvidia
        NVIDIA_MODEL=meta/llama-3.1-8b-instruct
        NVIDIA_API_KEY=${NVIDIA_API_KEY}
        LLM_CONFIG_ENCRYPTION_KEY=${LLM_CONFIG_ENCRYPTION_KEY:-${SECRET_KEY}}
        TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
        CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
        CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID:-}
        FRONTEND_URL=https://zeroqwait.com
        ENVEOF
        sed -i 's/^[[:space:]]*//' "${ENV_FILE}"
        chmod 600 "${ENV_FILE}"
        echo "✅ backend/.env written ($(wc -l < "${ENV_FILE}") lines)"
        if grep -q "^NVIDIA_API_KEY=.\{8\}" "${ENV_FILE}"; then
          echo "✅ NVIDIA_API_KEY present"
        else
          echo "❌ NVIDIA_API_KEY is missing — check GitHub Secret NVIDIA_API_KEY"
          exit 1
        fi

    - name: Deploy Application
      run: |
        set -euo pipefail
        echo "🚀 Starting deployment..."
        cd /home/pi/Documents/projects/apps/zeroqwait

        echo "📥 Pulling latest changes from GitHub..."
        git pull origin main

        echo "🛑 Stopping containers..."
        docker compose -f docker-compose.prod.yml down
        docker system prune -f

        echo "🔨 Building Docker images..."
        docker compose -f docker-compose.prod.yml build --pull --no-cache

        echo "🚀 Starting containers..."
        docker compose -f docker-compose.prod.yml up -d

        echo "⏳ Waiting for containers to start..."
        sleep 20

        echo "📊 Container status:"
        docker compose -f docker-compose.prod.yml ps
        docker image prune -f
        echo "✅ Deployment complete!"

    - name: Verify Deployment
      run: |
        set -euo pipefail
        echo "🔍 Verifying deployment..."

        if curl -sf http://localhost:8001/ > /dev/null; then
          echo "✅ Backend is responding"
        else
          echo "❌ Backend health check failed"
          docker compose -f docker-compose.prod.yml logs --tail=40 backend
          exit 1
        fi

        if curl -sf http://localhost:3001/ > /dev/null; then
          echo "✅ Frontend is responding"
        else
          echo "❌ Frontend health check failed"
          exit 1
        fi

        LOADED_KEY=$(docker exec zeroqwait-backend \
          python3 -c "import os; k=os.getenv('NVIDIA_API_KEY',''); print('SET' if len(k)>8 else 'MISSING')" 2>/dev/null || echo "UNKNOWN")
        if [[ "${LOADED_KEY}" == "SET" ]]; then
          echo "✅ NVIDIA_API_KEY is loaded inside the backend container"
        else
          echo "❌ NVIDIA_API_KEY not loaded (got: ${LOADED_KEY})"
          exit 1
        fi

        echo "🎉 Deployment verified successfully!"
        echo "🌐 Site: https://zeroqwait.com"
