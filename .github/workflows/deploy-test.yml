name: Deploy Test Environment

on:
  push:
    branches-ignore:
      - prod
  workflow_dispatch:

concurrency:
  group: zeroqwait-deploy
  cancel-in-progress: true

jobs:
  deploy-test:
    runs-on: self-hosted
    environment: test
    env:
      # Fixed checkout path to prevent run-specific directory buildup.
      CHECKOUT_PATH: zeroqwait-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          path: ${{ env.CHECKOUT_PATH }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy to test (localhost:3000)
        env:
          REGISTRY: ghcr.io/nfornj
          SECRET_KEY:                ${{ secrets.SECRET_KEY }}
          DB_USER:                   ${{ secrets.DB_USER }}
          DB_PASSWORD:               ${{ secrets.DB_PASSWORD }}
          DB_NAME:                   ${{ secrets.DB_NAME }}
          NVIDIA_API_KEY:            ${{ secrets.NVIDIA_API_KEY }}
          LLM_CONFIG_ENCRYPTION_KEY: ${{ secrets.LLM_CONFIG_ENCRYPTION_KEY }}
          TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
          STRIPE_SECRET_KEY:         ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET:     ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          ODOO_PASSWORD:             ${{ secrets.ODOO_PASSWORD }}
        run: |
          cd "${CHECKOUT_PATH}"
          chmod +x deployment/scripts/deploy-test.sh
          deployment/scripts/deploy-test.sh
