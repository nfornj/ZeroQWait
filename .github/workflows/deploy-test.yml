name: Deploy Test Environment

on:
  push:
    branches-ignore:
      - prod
  workflow_dispatch:

concurrency:
  group: zeroqwait-deploy
  cancel-in-progress: false

jobs:
  deploy-test:
    runs-on: self-hosted
    env:
      # Fixed checkout path to prevent run-specific directory buildup.
      CHECKOUT_PATH: zeroqwait-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          path: ${{ env.CHECKOUT_PATH }}

      - name: Deploy to test (localhost:3000)
        run: |
          cd "${CHECKOUT_PATH}"
          chmod +x deployment/scripts/deploy-test.sh
          deployment/scripts/deploy-test.sh
