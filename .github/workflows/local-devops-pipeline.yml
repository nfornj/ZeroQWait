name: Local DevOps Pipeline

on:
  workflow_dispatch:

jobs:
  test-build-push:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run local CI/CD pipeline
        env:
          REGISTRY: ghcr.io/nfornj
          AUTO_COMMIT: "false"
          ARGOCD_SYNC: "false"
        run: |
          chmod +x deployment/scripts/run-local-pipeline.sh deployment/scripts/prune-registry-tags.sh
          ./deployment/scripts/run-local-pipeline.sh
