name: Verify Secrets & NVIDIA API Key

# Manually triggered workflow to confirm that:
#   1. GitHub Secrets are correctly set
#   2. NVIDIA_API_KEY is valid and the API responds
# Run this after adding/rotating secrets to confirm everything works.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to verify"
        required: true
        default: prod
        type: choice
        options:
          - prod
          - test

jobs:
  verify:
    name: Verify secrets and API connectivity
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}

    steps:
    - name: Check required secrets are set
      env:
        NVIDIA_API_KEY:            ${{ secrets.NVIDIA_API_KEY }}
        SECRET_KEY:                ${{ secrets.SECRET_KEY }}
        DB_PASSWORD:               ${{ secrets.DB_PASSWORD }}
        LLM_CONFIG_ENCRYPTION_KEY: ${{ secrets.LLM_CONFIG_ENCRYPTION_KEY }}
      run: |
        set -euo pipefail
        echo "🔍 Checking required GitHub Secrets..."
        MISSING=()

        check() {
          local name="$1"
          local val="$2"
          if [[ -z "${val}" ]]; then
            echo "  ❌ ${name} — NOT SET"
            MISSING+=("${name}")
          else
            local masked="${val:0:4}****${val: -4}"
            echo "  ✅ ${name} = ${masked}"
          fi
        }

        check "NVIDIA_API_KEY"            "${NVIDIA_API_KEY:-}"
        check "SECRET_KEY"                "${SECRET_KEY:-}"
        check "DB_PASSWORD"               "${DB_PASSWORD:-}"
        check "LLM_CONFIG_ENCRYPTION_KEY" "${LLM_CONFIG_ENCRYPTION_KEY:-}"

        # Optional secrets — warn but don't fail
        warn() {
          local name="$1"
          local val="$2"
          if [[ -z "${val}" ]]; then
            echo "  ⚠️  ${name} — not set (optional)"
          else
            echo "  ✅ ${name} = ${val:0:4}****"
          fi
        }
        warn "TELEGRAM_BOT_TOKEN" "${{ secrets.TELEGRAM_BOT_TOKEN }}"
        warn "DB_USER"            "${{ secrets.DB_USER }}"
        warn "REDIS_PASSWORD"     "${{ secrets.REDIS_PASSWORD }}"
        warn "PI_HOST"            "${{ secrets.PI_HOST }}"
        warn "PI_USER"            "${{ secrets.PI_USER }}"
        warn "CLOUDFLARE_API_TOKEN" "${{ secrets.CLOUDFLARE_API_TOKEN }}"
        warn "CLOUDFLARE_ZONE_ID"   "${{ secrets.CLOUDFLARE_ZONE_ID }}"

        if [[ ${#MISSING[@]} -gt 0 ]]; then
          echo ""
          echo "❌ Missing required secrets: ${MISSING[*]}"
          echo "Add them at: Repo → Settings → Secrets and variables → Actions → New repository secret"
          exit 1
        fi

        echo ""
        echo "✅ All required secrets are set!"

    - name: Test NVIDIA API key
      env:
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      run: |
        set -euo pipefail
        echo "🧪 Testing NVIDIA NIM API key..."

        RESPONSE=$(curl -sf --max-time 30 \
          -X POST "https://integrate.api.nvidia.com/v1/chat/completions" \
          -H "Authorization: Bearer ${NVIDIA_API_KEY}" \
          -H "Content-Type: application/json" \
          -d '{
            "model": "meta/llama-3.1-8b-instruct",
            "messages": [{"role": "user", "content": "Say OK"}],
            "max_tokens": 5
          }' 2>&1) || {
            echo "❌ NVIDIA API request failed"
            echo "Response: ${RESPONSE}"
            echo ""
            echo "Possible causes:"
            echo "  - Invalid NVIDIA_API_KEY"
            echo "  - Network issue"
            echo "  - API quota exceeded"
            exit 1
          }

        # Check the response contains expected fields
        if echo "${RESPONSE}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['choices'][0]['message']['content'])" 2>/dev/null; then
          echo "✅ NVIDIA API key is valid and working!"
          echo "   Model: meta/llama-3.1-8b-instruct"
        else
          echo "❌ Unexpected response format from NVIDIA API:"
          echo "${RESPONSE}" | head -20
          exit 1
        fi

    - name: Summary
      run: |
        echo "🎉 All checks passed!"
        echo ""
        echo "Your GitHub Secrets are correctly configured."
        echo "NVIDIA API key is valid — model responds correctly."
        echo ""
        echo "Next steps:"
        echo "  - Trigger 'Deploy to Production Host' or 'Deploy Production Environment'"
        echo "  - The deploy workflow will automatically inject secrets into the container"
