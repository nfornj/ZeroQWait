name: Deploy Production Environment

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  deploy-prod:
    runs-on: self-hosted
    env:
      REGISTRY_DATA_PATH: /media/neekrishrichu/One Touch/projects/zeroqwait
      SKIP_TESTS: "true"
      # Fixed path prevents run-<id> directory buildup across prod deploys.
      CHECKOUT_PATH: zeroqwait-prod-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          path: ${{ env.CHECKOUT_PATH }}

      - name: Ensure local registry
        env:
          REGISTRY_DATA_PATH: /media/neekrishrichu/One Touch/projects/zeroqwait
        run: |
          cd "${CHECKOUT_PATH}"
          chmod +x deployment/scripts/setup-local-registry.sh
          # sudo -E preserves REGISTRY_DATA_PATH when escalating.
          sudo -E deployment/scripts/setup-local-registry.sh

      - name: Ensure Kubernetes CLI
        run: |
          # Use existing kubectl or k3s when present; install kubectl only if missing.
          if sudo sh -c 'command -v kubectl >/dev/null 2>&1 || command -v k3s >/dev/null 2>&1'; then
            echo "Kubernetes CLI already available"
          else
            echo "Installing kubectl on self-hosted runner"
            KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
            curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
            chmod +x /tmp/kubectl
            sudo mv /tmp/kubectl /usr/local/bin/kubectl
          fi
          sudo sh -c 'command -v kubectl || command -v k3s'

      - name: Deploy to production (zeroqwait.com)
        run: |
          cd "${CHECKOUT_PATH}"
          chmod +x deployment/scripts/deploy-prod.sh deployment/scripts/run-local-pipeline.sh deployment/scripts/prune-registry-tags.sh
          deployment/scripts/deploy-prod.sh

      - name: Purge Cloudflare cache
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ZONE_ID != '' }}
        run: |
          echo "Purging Cloudflare cache for zeroqwait.com..."
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | tee /tmp/cf_purge_result.json
          if grep -q '"success":true' /tmp/cf_purge_result.json; then
            echo "Cloudflare cache purged successfully"
          else
            echo "WARNING: Cloudflare cache purge may have failed:"
            cat /tmp/cf_purge_result.json
          fi

      - name: Clean stale checkout directories
        if: always()
        run: |
          find "${GITHUB_WORKSPACE}" -maxdepth 1 -type d -name 'run-[0-9]*' \
            -exec sudo rm -rf {} + 2>/dev/null || true
          echo "Cleanup complete"
