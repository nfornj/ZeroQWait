[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    # Database
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    # Cache
    "redis>=5.0.0",
    # AI / ML
    "pydantic>=2.10.0",
    "pydantic-ai>=0.8.0",
    "sentence-transformers>=4.0.0",
    "numpy>=1.26.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "email-validator>=2.0.0",
    # HTTP client
    "httpx>=0.27.0",
    # Config
    "python-dotenv>=1.0.0",
    # Utilities
    "python-slugify>=8.0.0",
    "python-dateutil>=2.9.0",
    # Scripts (seed data)
    "faker>=20.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
]
