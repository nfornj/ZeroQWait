[project]
name = "zeroqwait-backend"
version = "0.1.0"
description = "FastAPI backend for ZeroQwait universal queue management system"
authors = [
    {name = "ZeroQwait Team", email = "team@zeroqwait.com"}
]
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.23.2",
    "supabase>=2.9.0",
    "pydantic>=2.10.0",
    "python-jose==3.3.0",
    "passlib==1.7.4",
    "python-multipart==0.0.6",
    "httpx>=0.24.0",
    "python-dotenv==1.0.0",
    "bcrypt==4.0.1",
    "email-validator==2.1.0.post1",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic-ai==0.0.14"
]
requires-python = ">=3.9,<3.11"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
python.use_venv = false
python.version = "3.9"
package-dir = "."
source-includes = ["README.md"]

[tool.pdm.dev-dependencies]
test = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "httpx>=0.24.0"
]
lint = [
    "black==23.10.1",
    "isort==5.12.0",
    "flake8==6.1.0",
    "mypy==1.6.1"
]

[tool.pdm.scripts]
start = "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
test = "pytest tests/"
lint = {composite = ["black .", "isort .", "flake8", "mypy ."]} 