# GPU Time-Slicing Configuration
# Allows multiple pods to share a single GPU (RTX 5070 Ti)
# Replicas=2: one for Ollama (LLM), one for Qwen3-TTS
apiVersion: v1
kind: ConfigMap
metadata:
  name: time-slicing-config
  namespace: gpu-operator
data:
  any: |-
    version: v1
    sharing:
      timeSlicing:
        resources:
          - name: nvidia.com/gpu
            replicas: 2
