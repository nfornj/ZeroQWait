apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: zeroqwait
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.28
        command: ['sh', '-c', 'until nc -z postgres.zeroqwait.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done;']
      - name: init-database
        image: python:3.11-slim
        workingDir: /app
        command: ["/bin/bash", "-c"]
        args:
          - |
            pip install uv
            uv pip install --system sqlalchemy psycopg2-binary python-dotenv
            python init_database.py
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secret
        volumeMounts:
        - name: app-code
          mountPath: /app
      containers:
      - name: backend
        image: python:3.11-slim
        workingDir: /app
        command: ["/bin/bash", "-c"]
        args:
          - |
            pip install uv
            uv sync
            uv run uvicorn main:app --host 0.0.0.0 --port 8000
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secret
        volumeMounts:
        - name: app-code
          mountPath: /app
        - name: static-uploads
          mountPath: /app/static/uploads
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        startupProbe:
          httpGet:
            path: /api/agent/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 80
        livenessProbe:
          httpGet:
            path: /api/agent/health
            port: 8000
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/agent/health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: app-code
        hostPath:
          # Code lives in the git repo on this machine — no sync needed
          path: /home/neekrishrichu/projects/FastCuts/backend
          type: Directory
      - name: static-uploads
        hostPath:
          # Persist uploads across pod restarts
          path: /home/neekrishrichu/apps/zeroqwait/uploads
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: zeroqwait
spec:
  selector:
    app: backend
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30000
