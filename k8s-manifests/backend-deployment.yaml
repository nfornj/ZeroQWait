apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: zeroqwait
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      priorityClassName: app-critical
      tolerations:
      - key: "workload-pool"
        operator: "Equal"
        value: "core-cpu"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: zeroqwait.io/node-pool
                operator: In
                values: ["core-cpu"]
      # Run as UID 1000 (appuser) — matches the user baked into the Docker image.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.28
        command: ['sh', '-c', 'until nc -z postgres.zeroqwait.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done;']
      containers:
      - name: backend
        # Image built by CI and pushed to GHCR.
        # The run-local-pipeline.sh sed step replaces the tag on every prod deploy.
        image: localhost:5000/prod/backend:v3c0bd2b
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secret
        volumeMounts:
        - name: static-uploads
          mountPath: /app/static/uploads
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        startupProbe:
          httpGet:
            path: /api/agent/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          # Pre-built image: startup is ~2 min (model load). 20 * 15s = 5 min ceiling.
          failureThreshold: 20
        livenessProbe:
          httpGet:
            path: /api/agent/health
            port: 8000
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/agent/health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: static-uploads
        hostPath:
          # Persist user-uploaded files across pod restarts on this single-node host.
          path: /home/neekrishrichu/apps/zeroqwait/uploads
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: zeroqwait
spec:
  selector:
    app: backend
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30000
