apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zeroqwait-ingress
  namespace: zeroqwait
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  # Main domain - frontend
  - host: "192.168.2.88.nip.io"
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
  
  # Wildcard subdomain for shops - routes to frontend (frontend will handle shop-specific UI)
  - host: "*.192.168.2.88.nip.io"
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
