apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: zeroqwait
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: node:18-alpine
        workingDir: /app
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Cleaning npm cache and node_modules..."
            npm cache clean --force
            rm -rf node_modules package-lock.json
            echo "Building frontend with API URL: /api (relative path)"
            npm install --legacy-peer-deps
            npm audit fix --force --audit-level=low
            NODE_OPTIONS="--max-old-space-size=1536" REACT_APP_API_URL=/api npm run build
            if [ -d "build" ] && [ -f "build/index.html" ]; then
              echo "Build successful!"
            else
              echo "Build failed, using old build if available"
            fi
            echo "Starting server on port 3000..."
            npx serve -s build -l 3000
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: app-code
          mountPath: /app
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 180
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 180
          periodSeconds: 5
      volumes:
      - name: app-code
        hostPath:
          path: /home/neekrishrichu/apps/zeroqwait/frontend
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: zeroqwait
spec:
  selector:
    app: frontend
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30001
