apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All resources deployed into staging namespace
namespace: zeroqwait-staging

resources:
  # Namespace itself
  - namespace.yaml
  # Secrets (same as prod — same DB, same NVIDIA key)
  - ../../backend-secret.yaml
  - ../../postgres-secret.yaml
  - ../../redis-secret.yaml
  # Config (patched below for staging-specific values)
  - ../../backend-configmap.yaml
  # App layer — backend, frontend, MCPs
  # postgres/redis/tts/asr are shared from the zeroqwait namespace
  - ../../backend-deployment.yaml
  - ../../frontend-deployment.yaml
  - ../../booking-mcp-deployment.yaml
  - ../../finance-mcp-deployment.yaml
  - ../../hr-mcp-deployment.yaml
  - ../../voice-mcp-deployment.yaml

patches:
  # Override staging-specific config values
  - target:
      kind: ConfigMap
      name: backend-config
    path: backend-config-patch.yaml
  # Reduce resource requests for staging (half of prod)
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"

# Track latest tags for staging (CI pushes latest on every build)
images:
  - name: ghcr.io/nfornj/backend
    newTag: latest
  - name: ghcr.io/nfornj/frontend
    newTag: latest
  - name: ghcr.io/nfornj/booking-mcp
    newTag: latest
  - name: ghcr.io/nfornj/finance-mcp
    newTag: latest
  - name: ghcr.io/nfornj/hr-mcp
    newTag: latest
  - name: ghcr.io/nfornj/voice-mcp
    newTag: latest
