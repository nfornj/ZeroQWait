# NetworkPolicies for data-tier isolation.
# Backend and MCP pods may connect to PostgreSQL (5432).
# Only backend may connect to Redis (6379).
# All other ingress to these pods is denied by default once a NetworkPolicy selects them.

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-backend-only
  namespace: zeroqwait
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
        - podSelector:
            matchLabels:
              app: hr-mcp
        - podSelector:
            matchLabels:
              app: booking-mcp
        - podSelector:
            matchLabels:
              app: finance-mcp
        - podSelector:
            matchLabels:
              app: temporal
        - podSelector:
            matchLabels:
              app: temporal-worker
        - podSelector:
            matchLabels:
              app: odoo
      ports:
        - protocol: TCP
          port: 5432

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-backend-only
  namespace: zeroqwait
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
        - podSelector:
            matchLabels:
              app: temporal-worker
      ports:
        - protocol: TCP
          port: 6379
