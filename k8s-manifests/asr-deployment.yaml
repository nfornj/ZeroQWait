apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-service
  namespace: zeroqwait
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asr-service
  template:
    metadata:
      labels:
        app: asr-service
    spec:
      runtimeClassName: nvidia
      containers:
        - name: asr-service
          image: localhost:5000/asr-service:v20260406120811-18332e3
          env:
            - name: MODEL_SIZE
              value: "medium"
            - name: DEVICE
              value: "cuda"
            - name: COMPUTE_TYPE
              value: "float16"
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
              nvidia.com/gpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2000m"
              nvidia.com/gpu: "1"
