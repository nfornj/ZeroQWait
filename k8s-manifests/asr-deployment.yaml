apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-service
  namespace: zeroqwait
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asr-service
  template:
    metadata:
      labels:
        app: asr-service
    spec:
      priorityClassName: voice-critical
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
        - name: asr-service
          image: ghcr.io/nfornj/prod/asr-service:latest
          imagePullPolicy: Always
          env:
            - name: MODEL_SIZE
              value: "medium"
            - name: DEVICE
              value: "cpu"
            - name: COMPUTE_TYPE
              value: "int8"
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
