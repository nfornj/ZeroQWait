# SECURITY NOTICE: This file is a template. Real values are NEVER committed to Git.
# Before first deploy on a new cluster, create a local copy with real values:
#   cp k8s-manifests/backend-secret.yaml k8s-manifests/backend-secret.local.yaml
#   # Edit backend-secret.local.yaml with real credentials, then:
#   kubectl apply -f k8s-manifests/backend-secret.local.yaml
# The deploy-prod.sh script will error if this secret is not already present in the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: zeroqwait
type: Opaque
stringData:
  DB_USER: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"
  SECRET_KEY: "REPLACE_ME_min_32_random_chars"
  REDIS_PASSWORD: "REPLACE_ME"
  # NVIDIA NIM API key — obtain from build.nvidia.com
  NVIDIA_API_KEY: "REPLACE_ME"
  # Telegram Bot token — obtain from @BotFather on Telegram
  TELEGRAM_BOT_TOKEN: "REPLACE_ME"
  # AWS SES + SNS — IAM user with ses:SendEmail and sns:Publish permissions
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
