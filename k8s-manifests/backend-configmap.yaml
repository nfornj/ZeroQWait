apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: zeroqwait
data:
  DB_HOST: "postgres.zeroqwait.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "zeroqwait"
  FRONTEND_URL: "http://192.168.2.134.nip.io"
  PYTHONUNBUFFERED: "1"
  USE_SUPABASE: "false"
  # LLM: NVIDIA NIM API is the primary provider (NVIDIA_API_KEY in backend-secret).
  # Ollama deployment in llm namespace is scaled to 0 — kept only as emergency fallback.
  LLM_PROVIDER: "nvidia"
  NVIDIA_MODEL: "meta/llama-3.1-8b-instruct"
  AGENT_SYNC_TIMEOUT_SECONDS: "120"
  REDIS_HOST: "redis.zeroqwait.svc.cluster.local"
  REDIS_PORT: "6379"
  BOOKING_MCP_URL: "http://booking-mcp.zeroqwait.svc.cluster.local:8890"
  FINANCE_MCP_URL: "http://finance-mcp.zeroqwait.svc.cluster.local:8891"
  HR_MCP_URL: "http://hr-mcp.zeroqwait.svc.cluster.local:8892"
  TEMPORAL_ENABLED: "false"
  TEMPORAL_ADDRESS: "temporal.zeroqwait.svc.cluster.local:7233"
  TEMPORAL_NAMESPACE: "default"
  TEMPORAL_TASK_QUEUE: "zeroqwait-agent-brain"
  # All voice operations route through voice-mcp (the MCP voice gateway).
  # voice-mcp proxies to tts-service:8880 and asr-service:8000 internally.
  TTS_SERVICE_URL: "http://voice-mcp.zeroqwait.svc.cluster.local:8881"
  ASR_SERVICE_URL: "http://voice-mcp.zeroqwait.svc.cluster.local:8881/transcribe"
  # Telegram — webhook mode in K8s (same as docker-compose default).
  # Polling mode is only needed for local dev without a public URL.
  TELEGRAM_MODE: "webhook"
  TELEGRAM_POLL_TIMEOUT: "30"
  # Allow 120 s per owner message (NVIDIA NIM can take 30-40 s per LLM call;
  # classify_intent + receptionist + synthesize = up to 3 calls ≈ 90-120 s).
  TELEGRAM_OWNER_REPLY_TIMEOUT_SECONDS: "120"
  # Finance query engine LLM timeout — Ollama qwen3:14b needs up to 600 s for
  # complex multi-table aggregation queries; NVIDIA NIM finishes well under this.
  FINANCE_QUERY_LLM_TIMEOUT_SECONDS: "600"
  # Dev/test: auto-link any unknown Telegram user to this shop (shop id=501 = "Test" shop).
  # Remove or set to "" to disable in production.
  TELEGRAM_DEV_SHOP_ID: "501"
  # Odoo CRM/ERP integration — points to the Docker Odoo instance on the host.
  ODOO_ENABLED: "true"
  ODOO_URL: "http://192.168.2.134:8069"
  ODOO_DB: "odoo"
  ODOO_USER: "admin"
  ODOO_PASSWORD: "admin"
