apiVersion: v1
kind: Secret
metadata:
  name: odoo-secret
  namespace: zeroqwait
type: Opaque
stringData:
  # Postgres role password for the 'odoo' DB user (used by the Odoo container to connect to postgres)
  # Change this in production — must match the password set by the odoo-db-init Job
  ODOO_DB_PASSWORD: "odoo_k8s_secure_password"
