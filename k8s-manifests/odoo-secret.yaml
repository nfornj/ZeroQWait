apiVersion: v1
kind: Secret
metadata:
  name: odoo-secret
  namespace: zeroqwait
type: Opaque
stringData:
  # Postgres role password for the 'odoo' DB user (used by the Odoo container to connect to postgres)
  # Change this in production — must match the password set by the odoo-db-init Job
  ODOO_DB_PASSWORD: "odoo_k8s_secure_password"
  # Odoo application/API password used by backend XML-RPC integrations.
  # Must match the configured Odoo admin/service-user password in the live Odoo database.
  ODOO_PASSWORD: "REPLACE_ME_ODOO_APP_PASSWORD"
