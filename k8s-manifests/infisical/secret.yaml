# SECURITY NOTICE: This file is a template. Apply real values manually on first deploy.
# The app deployment reads these values from the in-cluster infisical-secret.
apiVersion: v1
kind: Secret
metadata:
  name: infisical-secret
  namespace: infisical
type: Opaque
stringData:
  DB_CONNECTION_URI: "postgresql://REPLACE_ME_USER:REPLACE_ME_PASSWORD@postgres.zeroqwait.svc.cluster.local:5432/infisical"
  REDIS_URL: "redis://:REPLACE_ME_REDIS_PASSWORD@redis.zeroqwait.svc.cluster.local:6379"
  # Generate with: openssl rand -hex 16
  ENCRYPTION_KEY: "REPLACE_ME_16_BYTE_HEX_KEY"
  AUTH_SECRET: "REPLACE_ME_RANDOM_AUTH_SECRET"
  JWT_SECRET: "REPLACE_ME_RANDOM_JWT_SECRET"
