apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-mcp
  namespace: zeroqwait
  labels:
    app: booking-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-mcp
  template:
    metadata:
      labels:
        app: booking-mcp
    spec:
      priorityClassName: app-critical
      tolerations:
        - key: "workload-pool"
          operator: "Equal"
          value: "core-cpu"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: zeroqwait.io/node-pool
                    operator: In
                    values: ["core-cpu"]
      containers:
        - name: booking-mcp
          image: localhost:5000/prod/booking-mcp:latest
          ports:
            - containerPort: 8890
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8890"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8890
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8890
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: booking-mcp
  namespace: zeroqwait
  labels:
    app: booking-mcp
spec:
  type: ClusterIP
  selector:
    app: booking-mcp
  ports:
    - name: http
      port: 8890
      targetPort: 8890
      protocol: TCP