apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-b2-backup
  namespace: zeroqwait
  labels:
    app: postgres-b2-backup
    zeroqwait.io/tier: shared-infra
spec:
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: postgres-b2-backup
            zeroqwait.io/tier: shared-infra
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:3.20
              imagePullPolicy: IfNotPresent
              env:
                - name: DB_HOST
                  value: postgres.zeroqwait.svc.cluster.local
                - name: DB_PORT
                  value: "5432"
                - name: DB_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: backend-config
                      key: DB_NAME
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: backend-secret
                      key: DB_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backend-secret
                      key: DB_PASSWORD
                - name: B2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: zeroqwait-backup-secret
                      key: B2_ENDPOINT
                - name: B2_BUCKET_NAME
                  valueFrom:
                    secretKeyRef:
                      name: zeroqwait-backup-secret
                      key: B2_BUCKET_NAME
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: zeroqwait-backup-secret
                      key: B2_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: zeroqwait-backup-secret
                      key: B2_APP_KEY
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    secretKeyRef:
                      name: zeroqwait-backup-secret
                      key: B2_REGION
                      optional: true
                - name: B2_BACKUP_PREFIX
                  value: postgres/daily
                - name: RETENTION_DAYS
                  value: "14"
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  apk add --no-cache aws-cli coreutils gzip postgresql16-client

                  : "${DB_HOST:?DB_HOST is required}"
                  : "${DB_PORT:?DB_PORT is required}"
                  : "${DB_NAME:?DB_NAME is required}"
                  : "${DB_USER:?DB_USER is required}"
                  : "${PGPASSWORD:?PGPASSWORD is required}"
                  : "${B2_ENDPOINT:?B2_ENDPOINT is required}"
                  : "${B2_BUCKET_NAME:?B2_BUCKET_NAME is required}"
                  : "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}"
                  : "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}"

                  export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-005}"

                  backup_name="backup-$(date -u +%Y-%m-%d-%H).sql.gz"
                  dump_file="/tmp/${backup_name%.gz}"
                  backup_file="/tmp/${backup_name}"
                  backup_prefix="${B2_BACKUP_PREFIX#/}"
                  backup_prefix="${backup_prefix%/}"
                  retention_days="${RETENTION_DAYS:-14}"

                  pg_dump \
                    --host="${DB_HOST}" \
                    --port="${DB_PORT}" \
                    --username="${DB_USER}" \
                    --dbname="${DB_NAME}" \
                    --format=plain \
                    --clean \
                    --if-exists \
                    --no-owner \
                    --no-acl \
                    --file="${dump_file}"

                  gzip -9 "${dump_file}"

                  aws --endpoint-url "${B2_ENDPOINT}" s3 cp \
                    "${backup_file}" \
                    "s3://${B2_BUCKET_NAME}/${backup_prefix}/${backup_name}"

                  aws --endpoint-url "${B2_ENDPOINT}" s3 ls \
                    "s3://${B2_BUCKET_NAME}/${backup_prefix}/" > /tmp/aws-list.txt

                  awk '$4 ~ /^backup-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}\.sql\.gz$/ { print $4 }' \
                    /tmp/aws-list.txt | sort > /tmp/backup-list.txt

                  backup_count="$(wc -l < /tmp/backup-list.txt | tr -d ' ')"
                  if [ "${backup_count}" -gt "${retention_days}" ]; then
                    delete_count="$((backup_count - retention_days))"
                    head -n "${delete_count}" /tmp/backup-list.txt | while IFS= read -r old_backup; do
                      aws --endpoint-url "${B2_ENDPOINT}" s3 rm \
                        "s3://${B2_BUCKET_NAME}/${backup_prefix}/${old_backup}"
                    done
                  fi

                  rm -f "${backup_file}" /tmp/aws-list.txt /tmp/backup-list.txt
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi