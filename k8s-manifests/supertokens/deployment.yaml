apiVersion: apps/v1
kind: Deployment
metadata:
  name: supertokens
  namespace: zeroqwait
  labels:
    app: supertokens
    app.kubernetes.io/name: supertokens
    zeroqwait.io/tier: shared-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supertokens
  template:
    metadata:
      labels:
        app: supertokens
        app.kubernetes.io/name: supertokens
        zeroqwait.io/tier: shared-infra
    spec:
      containers:
        - name: supertokens
          image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3567
          env:
            - name: POSTGRESQL_CONNECTION_URI
              valueFrom:
                secretKeyRef:
                  name: supertokens-secret
                  key: POSTGRESQL_CONNECTION_URI
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: supertokens-secret
                  key: API_KEYS
          readinessProbe:
            httpGet:
              path: /hello
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /hello
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
