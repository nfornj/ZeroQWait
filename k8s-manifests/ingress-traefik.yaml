apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zeroqwait-ingress
  namespace: zeroqwait
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - "192.168.2.88.nip.io"
    - "*.192.168.2.88.nip.io"
    - "zeroqwait.com"
    - "*.zeroqwait.com"
    secretName: zeroqwait-wildcard-tls
  rules:
  # Local testing (nip.io)
  - host: "192.168.2.88.nip.io"
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
  - host: "*.192.168.2.88.nip.io"
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
  # Production domain
  - host: "zeroqwait.com"
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
  - host: "*.zeroqwait.com"
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
