# Piper TTS Deployment - CPU-only (no GPU required)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts-service
  namespace: zeroqwait
  labels:
    app: tts-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tts-service
  template:
    metadata:
      labels:
        app: tts-service
    spec:
      priorityClassName: voice-critical
      containers:
        - name: tts-service
          image: localhost:5000/prod/tts-service:v20260429092027-30a8ac4
          imagePullPolicy: Always
          ports:
            - containerPort: 8880
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8880"
            - name: MODELS_DIR
              value: "/app/models"
            - name: TTS_DEFAULT_VOICE
              value: "female"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: 8880
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: 8880
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8880
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
---
# Piper TTS Service
apiVersion: v1
kind: Service
metadata:
  name: tts-service
  namespace: zeroqwait
  labels:
    app: tts-service
spec:
  type: NodePort
  ports:
    - port: 8880
      targetPort: 8880
      nodePort: 30880
      protocol: TCP
  selector:
    app: tts-service
