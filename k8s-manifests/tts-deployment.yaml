# Qwen3-TTS Deployment — GPU-accelerated, voice: Vivian
# Model: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
# DO NOT change the voice, model, or port without AGENTS.md §0.1 approval
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts-service
  namespace: zeroqwait
  labels:
    app: tts-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tts-service
  template:
    metadata:
      labels:
        app: tts-service
    spec:
      priorityClassName: voice-critical
      containers:
        - name: tts-service
          image: ghcr.io/nfornj/tts-service:v20260429092027-30a8ac4
          imagePullPolicy: Always
          ports:
            - containerPort: 8880
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8880"
            - name: TTS_DEFAULT_VOICE
              value: "Vivian"
            - name: TTS_MODEL
              value: "Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice"
            - name: HF_HOME
              value: "/data/huggingface"
            - name: TRANSFORMERS_CACHE
              value: "/data/huggingface"
          resources:
            requests:
              memory: "4Gi"
              cpu: "1"
              nvidia.com/gpu: "1"
            limits:
              memory: "8Gi"
              cpu: "2"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: tts-model-cache
              mountPath: /data/huggingface
          startupProbe:
            httpGet:
              path: /health
              port: 8880
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health
              port: 8880
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8880
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
      volumes:
        - name: tts-model-cache
          persistentVolumeClaim:
            claimName: tts-model-cache
      terminationGracePeriodSeconds: 30
---
# Qwen3-TTS Service
apiVersion: v1
kind: Service
metadata:
  name: tts-service
  namespace: zeroqwait
  labels:
    app: tts-service
spec:
  type: NodePort
  ports:
    - port: 8880
      targetPort: 8880
      nodePort: 30880
      protocol: TCP
  selector:
    app: tts-service

