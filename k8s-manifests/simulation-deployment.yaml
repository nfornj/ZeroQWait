apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation
  namespace: zeroqwait
  labels:
    app: simulation
    zeroqwait.io/tier: shared-infra
    zeroqwait.io/component: simulation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulation
  template:
    metadata:
      labels:
        app: simulation
        zeroqwait.io/tier: shared-infra
        zeroqwait.io/component: simulation
    spec:
      restartPolicy: Always
      tolerations:
      - key: "workload-pool"
        operator: "Equal"
        value: "core-cpu"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: zeroqwait.io/node-pool
                operator: In
                values: ["core-cpu"]
      containers:
      - name: simulation
        image: ghcr.io/nfornj/simulation:v20260527021223-82fbae6
        imagePullPolicy: IfNotPresent
        command: ["python", "-u", "run_manifest.py"]
        env:
        - name: BASE_URL
          value: http://backend.zeroqwait.svc.cluster.local:8000
        - name: SIM_MANIFEST_PATH
          value: /app/shop_manifest.json
        - name: SIM_LOG_ONLY
          value: "true"
        - name: SHOP_OPEN_HOUR
          value: "0"
        - name: SHOP_CLOSE_HOUR
          value: "0"
        - name: SIM_START_STAGGER_SECONDS
          value: "10"
        - name: CUSTOMER_ARRIVAL_MIN
          value: "35"
        - name: CUSTOMER_ARRIVAL_MAX
          value: "70"
        - name: OWNER_QUERY_MIN
          value: "300"
        - name: OWNER_QUERY_MAX
          value: "600"
        - name: APPROVAL_SCENARIO_MIN
          value: "300"
        - name: APPROVAL_SCENARIO_MAX
          value: "600"
        - name: EMPLOYEE_LEAVE_MIN
          value: "300"
        - name: EMPLOYEE_LEAVE_MAX
          value: "600"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]