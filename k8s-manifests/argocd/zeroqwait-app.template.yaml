apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zeroqwait
  namespace: argocd
spec:
  project: default
  source:
    repoURL: __REPO_URL__
    targetRevision: __TARGET_REVISION__
    path: k8s-manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: zeroqwait
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
